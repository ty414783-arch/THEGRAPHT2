# Element Web on a.thegrapht.su. Include inside that HTTPS server block,
# before location /, together with matrix-dev.conf.

location = /thg-element-override.css {
    default_type text/css;
    add_header Cache-Control "no-store";
    alias /var/www/matrix-wellknown/element-override.css;
}

location / {
    proxy_pass http://127.0.0.1:8091;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Accept-Encoding "";
    sub_filter '</head>' '<link rel="stylesheet" href="/thg-element-override.css"></head>';
    sub_filter_once on;
}
